# Reproducible conda environment for FTNODE.
#
# Mirrors the project's original pip-based .venv: Python 3.10.5 with the exact
# pinned package set (notably torch==2.10.0). Everything comes from pip so the
# wheels match the original environment bit-for-bit; conda only provides the
# interpreter and pip. The deprecated `stabnode` editable install is intentionally
# omitted.
#
# Create (run from the repo root so `-e .` resolves to this package):
#     conda env create -f environment.yaml
#     conda activate ftnode
#
# Apple Silicon note: torch==2.10.0 publishes ONLY an arm64 macOS wheel. If your
# conda/anaconda base is an Intel (osx-64) build it will create an x86_64 env by
# default and the torch pin fails to resolve ("No matching distribution"). Force an
# arm64 env, then persist the subdir so later installs stay arm64:
#     CONDA_SUBDIR=osx-arm64 conda env create -f environment.yaml
#     conda env config vars set CONDA_SUBDIR=osx-arm64 -n ftnode
#
# Re-pin after changing deps:
#     conda env export --no-builds > environment.yaml   # or refresh the pip list below
name: ftnode
channels:
  - conda-forge
dependencies:
  - python=3.10.5
  - pip
  - pip:
      - appnope==0.1.4
      - asttokens==3.0.1
      - comm==0.2.3
      - contourpy==1.3.2
      - cycler==0.12.1
